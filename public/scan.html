<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>DarkNight Fitness - QR Scan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .scan-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #f3f4f6;
            border-top: 8px solid #4F46E5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #10B981;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5em;
            margin: 0 auto 25px;
            animation: scaleIn 0.5s ease-out;
        }
        
        .error-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #EF4444;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5em;
            margin: 0 auto 25px;
            animation: scaleIn 0.5s ease-out;
        }
        
        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 15px;
            color: #1e293b;
        }
        
        p {
            color: #64748b;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .action-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        .action-badge.checkin {
            background: #D1FAE5;
            color: #065F46;
        }
        
        .action-badge.checkout {
            background: #FEF3C7;
            color: #92400E;
        }
        
        .btn-primary {
            padding: 14px 28px;
            background: #4F46E5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            background: #4338CA;
            transform: translateY(-2px);
        }
        
        .time-info {
            margin-top: 20px;
            padding: 15px;
            background: #F8FAFC;
            border-radius: 12px;
            color: #64748b;
            font-size: 0.95em;
        }
        
        @media (max-width: 480px) {
            .scan-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.6em;
            }
            
            .loading-spinner,
            .success-icon,
            .error-icon {
                width: 70px;
                height: 70px;
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="scan-container" id="scanContainer">
        <div class="loading-spinner"></div>
        <h1>Processing...</h1>
        <p>Please wait while we record your attendance.</p>
    </div>

    <script>
        // Get action from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action'); // 'checkin' or 'checkout'
        
        async function processAttendance() {
            const container = document.getElementById('scanContainer');
            
            // Check if action is valid
            if (!action || (action !== 'checkin' && action !== 'checkout')) {
                showError('Invalid QR Code', 'This QR code is not recognized.');
                return;
            }
            
            // Check if user is logged in
            const userSession = localStorage.getItem('userSession');
            if (!userSession) {
                // Redirect to login with return URL
                localStorage.setItem('pendingAction', action);
                window.location.href = '/login.html?redirect=scan&action=' + action;
                return;
            }
            
            try {
                const user = JSON.parse(userSession);
                
                // Record attendance
                const result = await window.supabaseClient.recordAttendance(user.id, action);
                
                if (result.success) {
                    showSuccess(action, result.member);
                } else {
                    showError('Error', result.error || 'Could not record attendance. Please try again.');
                }
            } catch (error) {
                console.error('Attendance error:', error);
                showError('Error', 'An unexpected error occurred. Please try again.');
            }
        }
        
        function showSuccess(action, member) {
            const container = document.getElementById('scanContainer');
            const actionLabel = action === 'checkin' ? 'Check-In' : 'Check-Out';
            const actionClass = action === 'checkin' ? 'checkin' : 'checkout';
            const now = new Date();
            
            container.innerHTML = `
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <div class="action-badge ${actionClass}">
                    <i class="fas fa-${action === 'checkin' ? 'sign-in-alt' : 'sign-out-alt'}"></i>
                    ${actionLabel} Successful
                </div>
                <h1>Welcome${member ? ', ' + member.name : ''}!</h1>
                <p>Your attendance has been recorded successfully.</p>
                <div class="time-info">
                    <i class="far fa-clock"></i>
                    ${now.toLocaleString('en-US', { 
                        weekday: 'short', 
                        month: 'short', 
                        day: 'numeric', 
                        hour: 'numeric', 
                        minute: '2-digit', 
                        hour12: true 
                    })}
                </div>
                <br><br>
                <a href="/index.html" class="btn-primary">
                    <i class="fas fa-home"></i> Go to Dashboard
                </a>
            `;
        }
        
        function showError(title, message) {
            const container = document.getElementById('scanContainer');
            container.innerHTML = `
                <div class="error-icon">
                    <i class="fas fa-exclamation-circle"></i>
                </div>
                <h1>${title}</h1>
                <p>${message}</p>
                <a href="/login.html" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
            `;
        }
        
        // Process attendance when page loads
        window.addEventListener('DOMContentLoaded', processAttendance);
    </script>
</body>
</html>
